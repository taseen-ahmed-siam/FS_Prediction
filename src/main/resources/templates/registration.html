<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Future Sales Prediction - Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

<div class="w-full max-w-[480px] bg-white border border-slate-200 rounded-2xl p-6 md:p-10 shadow-sm space-y-6">

    <div class="text-center space-y-2">
        <div class="inline-flex w-10 h-10 bg-indigo-600 rounded-xl items-center justify-center text-white shadow-sm mb-1">
            <i class="fa-solid fa-id-card-clip text-sm"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Create an Account</h2>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}" class="space-y-4">

        <div class="space-y-1.5">
            <label for="UserId" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">User / Student ID</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-regular fa-id-badge text-sm"></i>
                    </span>
                <input type="text" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" id="UserId" th:field="*{userId}" placeholder="e.g. STU1024" required>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="exampleInputtext1" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Full Name</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                <input type="text" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" id="exampleInputtext1" th:field="*{name}" placeholder="John Doe" required>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="exampleInputEmail1" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Email Address</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                <input type="email" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" id="exampleInputEmail1" th:field="*{email}" placeholder="name@company.com" required>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="exampleInputPassword1" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                <input type="password" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" id="exampleInputPassword1" th:field="*{password}" placeholder="••••••••" required>
            </div>
        </div>

        <div class="pt-3">
            <button type="submit" class="w-full h-11 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2 shadow-sm shadow-indigo-600/10 transition-all">
                Sign Up Account <i class="fa-solid fa-check text-xs"></i>
            </button>
        </div>

        <div class="pt-4 border-t border-slate-100 text-center text-sm text-slate-500">
            Already have an Account?
            <a class="text-indigo-600 font-semibold hover:text-indigo-700 hover:underline ms-1" th:href="@{/login}">Sign In</a>
        </div>

    </form>
</div>


<div id="successModal"
     th:if="${param.success != null or param.register != null}"
     class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-all opacity-150">

    <div class="bg-white rounded-2xl border border-slate-100 p-6 md:p-8 shadow-2xl w-full max-w-sm text-center space-y-5 transform scale-100 transition-transform duration-300">

        <div class="inline-flex w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full items-center justify-center mx-auto ring-8 ring-emerald-50/50">
            <i class="fa-solid fa-circle-check text-3xl animate-bounce"></i>
        </div>

        <div class="space-y-1">
            <h3 class="text-lg font-bold text-slate-900 tracking-tight">Registration Successful!</h3>
            <p class="text-slate-500 text-sm leading-relaxed">Your professional forecasting account has been successfully verified and ready to deploy.</p>
        </div>

        <div class="pt-2">
            <a th:href="@{/login}" class="w-full h-11 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2 transition-all shadow-sm">
                Proceed to Login <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
        </div>

    </div>
</div>


<script>
    // Modal window layer auto escape safety block (optional click background override)
    const modal = document.getElementById('successModal');
    if(modal) {
        modal.addEventListener('click', function(e) {
            if(e.target === modal) {
                // Modal block wrapper can fade out gracefully
                modal.classList.add('hidden');
            }
        });
    }
</script>

</body>
</html>
