<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Sales - Prediction Trends</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto space-y-6">

    <div class="flex items-center justify-between border-b border-slate-200 pb-5">
        <div class="space-y-1">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2.5">
                <i class="fas fa-chart-line text-indigo-600 text-xl"></i> Sales Prediction Trend
            </h1>
            <p class="text-slate-500 text-sm">Visual analytics data streams and next-interval velocity summary matrix.</p>
        </div>

        <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl shadow-sm transition-all">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to Dashboard
        </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-5 md:p-6 shadow-sm flex flex-col justify-center">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span> Analytics Rendering Interface
            </div>
            <div class="relative w-full overflow-hidden max-h-[420px]">
                <canvas id="trendChart" class="w-full h-full"></canvas>
            </div>
        </div>

        <div class="space-y-4 flex flex-col justify-between">

            <div class="bg-white border border-slate-200 rounded-2xl p-5 md:p-6 shadow-sm flex-1 space-y-3">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-500"></i> Sales Data Summary
                </div>
                <div id="salesSummary" class="text-slate-700 text-sm font-medium leading-relaxed space-y-2">
                </div>
            </div>

            <div class="bg-indigo-900 border border-indigo-950 rounded-2xl p-5 md:p-6 shadow-md text-white flex-1 space-y-3 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-indigo-800/40 text-7xl pointer-events-none">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div class="text-xs font-bold text-indigo-200 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 bg-amber-400 rounded-full"></span> Model Forecasting Output
                </div>
                <div id="nextMonthPrediction" class="text-indigo-50 font-medium leading-relaxed text-sm bg-indigo-950/40 border border-indigo-800/40 p-4 rounded-xl">
                </div>
            </div>

        </div>
    </div>

</div>

<script src="/js/trend.js"></script>

</body>
</html>
