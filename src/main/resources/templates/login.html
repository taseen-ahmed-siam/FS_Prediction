<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Future Sales Prediction - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[460px] bg-white border border-slate-200 rounded-2xl p-6 md:p-10 shadow-sm space-y-6">

    <div class="text-center space-y-2">
        <div class="inline-flex w-10 h-10 bg-indigo-600 rounded-xl items-center justify-center text-white shadow-sm mb-1">
            <i class="fa-solid fa-shield-halved text-sm"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Future Sales Prediction System</h2>
    </div>

    <div class="space-y-3">
        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3.5 text-sm text-emerald-700 flex items-center gap-3" role="alert" th:if="${param.register != null}">
            <i class="fa-solid fa-circle-check text-base text-emerald-500 shrink-0"></i>
            <p class="font-medium">Thanks for your registration. Please log in!</p>
        </div>

        <div class="bg-slate-100 border border-slate-200 rounded-xl p-3.5 text-sm text-slate-600 flex items-center gap-3" role="alert" th:if="${param.logout != null}">
            <i class="fa-solid fa-circle-info text-base text-slate-400 shrink-0"></i>
            <p class="font-medium">You have successfully logged out!</p>
        </div>

        <div class="bg-rose-50 border border-rose-100 rounded-xl p-3.5 text-sm text-rose-700 flex items-center gap-3" role="alert" th:if="${param.error != null}">
            <i class="fa-solid fa-triangle-exclamation text-base text-rose-500 shrink-0"></i>
            <p class="font-medium">Email or password invalid. Please try again.</p>
        </div>
    </div>

    <form th:action="@{/login}" th:object="${login}" method="post" class="space-y-5">

        <div class="space-y-1.5">
            <label for="email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Email Address</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-regular fa-envelope text-sm"></i>
                    </span>
                <input type="email" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" id="email" th:field="*{email}" placeholder="name@company.com" required>
            </div>
        </div>

        <div class="space-y-1.5">
            <label for="password" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                <input type="password" class="w-full h-11 pl-10 border border-slate-200 bg-slate-50/50 rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder:text-slate-400" th:field="*{password}" id="password" placeholder="••••••••" required>
            </div>
        </div>

        <div class="flex items-center justify-between text-sm pt-1">
            <label class="flex items-center gap-2 select-none cursor-pointer group">
                <input class="w-4 h-4 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500 focus:ring-2 accent-indigo-600" type="checkbox" th:field="*{rememberMe}" id="flexCheckChecked" checked>
                <span class="text-slate-600 font-medium group-hover:text-slate-900 transition-colors">Remember this device</span>
            </label>
            <a class="text-indigo-600 font-semibold hover:text-indigo-700 hover:underline" href="./forgot-password">Forgot Password?</a>
        </div>

        <div class="pt-2">
            <button type="submit" class="w-full h-11 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2 shadow-sm shadow-indigo-600/10 transition-all">
                Sign In to Account <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>

        <div class="pt-4 border-t border-slate-100 text-center text-sm text-slate-500">
            Don't have an account yet?
            <a class="text-indigo-600 font-semibold hover:text-indigo-700 hover:underline ms-1" href="./register">Create an account</a>
        </div>

    </form>

</div>

</body>
</html>
