<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Sales - Image AI Recognition</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[520px] bg-white border border-slate-200 rounded-2xl p-6 md:p-10 shadow-sm space-y-6">

  <div class="text-center space-y-2">
    <div class="inline-flex w-10 h-10 bg-indigo-600 rounded-xl items-center justify-center text-white shadow-sm mb-1">
      <i class="fas fa-image text-sm"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-900 tracking-tight">AI Vision Analyzer</h2>
  </div>

  <form th:action="@{/analyze-image}" method="post" enctype="multipart/form-data" class="space-y-5">

    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Select Target Image</label>

      <label class="relative flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-slate-200 bg-slate-50/50 hover:bg-slate-50 rounded-xl cursor-pointer transition-all group p-4 text-center">
        <div class="space-y-1 text-slate-500">
          <i class="fa-solid fa-cloud-arrow-up text-xl text-slate-400 group-hover:text-indigo-600 transition-colors mb-1"></i>
          <p class="text-sm font-semibold group-hover:text-slate-900 transition-colors">Click to browse asset file</p>
          <p class="text-[11px] text-slate-400">Supports standard image formats (PNG, JPG, JPEG)</p>
        </div>
        <input type="file" name="imageFile" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required onchange="updateFileNameDisplay(this)" />
      </label>

      <div id="fileSelectedBadge" class="hidden text-xs bg-indigo-50 border border-indigo-100 text-indigo-700 px-3 py-2 rounded-xl flex items-center gap-2 font-medium">
        <i class="fa-regular fa-file-image text-sm"></i> <span id="fileNameTarget" class="truncate">SelectedFile.jpg</span>
      </div>
    </div>

    <div class="pt-1 flex flex-col sm:flex-row items-center gap-3">
      <a href="/dashboard" class="w-full sm:w-auto px-5 h-11 border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold text-sm rounded-xl flex items-center justify-center gap-2 transition-all order-2 sm:order-1">
        <i class="fa-solid fa-arrow-left text-xs"></i> Dashboard
      </a>

      <button type="submit" class="w-full sm:flex-1 h-11 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2 shadow-sm shadow-indigo-600/10 transition-all order-1 sm:order-2">
        Execute AI Prediction <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
      </button>
    </div>

  </form>

  <div th:if="${prediction}" class="bg-indigo-900 border border-indigo-950 rounded-2xl p-5 md:p-6 shadow-md text-white space-y-3 relative overflow-hidden">
    <div class="absolute -right-6 -bottom-6 text-indigo-800/40 text-7xl pointer-events-none">
      <i class="fa-solid fa-brain"></i>
    </div>

    <div class="text-xs font-bold uppercase tracking-widest text-indigo-200 flex items-center gap-2">
      <span class="w-2 h-2 bg-amber-400 rounded-full animate-ping"></span> Live Vision Stream Compilation
    </div>

    <h3 class="text-base font-bold tracking-tight">Model Analysis Result Summary:</h3>

    <div class="text-sm text-indigo-100/90 leading-relaxed bg-indigo-950/40 border border-indigo-800/40 p-4 rounded-xl font-medium" th:utext="${prediction}">
      Output computer vision processing pipeline dynamic string fallback text interface layer.
    </div>
  </div>

</div>

<script>
  function updateFileNameDisplay(inputElement) {
    const badge = document.getElementById('fileSelectedBadge');
    const targetText = document.getElementById('fileNameTarget');

    if (inputElement.files && inputElement.files.length > 0) {
      targetText.textContent = inputElement.files[0].name;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }
</script>

</body>
</html>
